const KEY='projectV.training.v1'; const localDay=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const defaultMode=()=>localDay()>='2026-12-08'&&localDay()<='2027-01-08'?'basic':'home';const initial=()=>({version:1,mode:defaultMode(),modeManual:false,day:'A',short:false,history:[],active:null,measures:[],runs:[],favs:[],timer:null,profile:{weight:73,band:false,pull:true},subs:{}});let storageOK=true,storageBlocked=false;let S;try{let raw=localStorage.getItem(KEY);let parsed=raw?JSON.parse(raw):initial();if(!validate(parsed))throw Error('Invalid stored data');S={...initial(),...parsed,profile:{...initial().profile,...parsed.profile}};}catch(e){S=initial();storageOK=false;storageBlocked=true;}if(!S.modeManual&&!S.active)S.mode=defaultMode();let drafts={};let tab='Today',search='',onlyFav=false,historyFilter='',exerciseSearch='',guideId=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeNum=(x,min,max)=>Number.isFinite(+x)&&x!==''&&+x>=min&&+x<=max;function save(){if(storageBlocked){$('status').textContent='Recovery needed · Settings';return false;}try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}$('status').textContent=storageOK?'Saved locally':'Not saved · export';return storageOK;}function toast(t){let a=document.createElement('div');a.className='toast';a.textContent=t;document.body.append(a);setTimeout(()=>a.remove(),2600);}function switchTab(t){captureDraft();tab=t;render();window.scrollTo(0,0);}const unit=e=>e.unit||'reps';const unilateral=new Set(['gymLat','gymDbRow','dbrow','selfrow','selflat','split','dbsplit','bandsplit','singlehinge','selfcurl','calf','hip','suitcase','latband']);function plan(){let p=plans[S.mode][S.day].map(([id,sets,...alts],i)=>{let options=[id,...alts];let saved=S.subs[`${S.mode}-${S.day}-${i}`];let chosen=options.includes(saved)?saved:id;if(S.mode==='home'&&!S.profile.band&&['latband','rearband','bandrow'].includes(chosen))chosen=chosen==='latband'?'latdb':chosen==='bandrow'?'dbrow':'rearself';if(S.mode==='home'&&!S.profile.pull&&['pull','chin'].includes(chosen))chosen='dbrow';return{id:chosen,sets:S.short?Math.min(2,sets):sets,alts:[...new Set([id,...alts,chosen])].filter(k=>!(S.mode==='home'&&((!S.profile.band&&['latband','rearband','bandrow'].includes(k))||(!S.profile.pull&&['pull','chin'].includes(k))))),idx:i};});if(S.short)p=p.filter(r=>r.idx<6||['core','plank','suitcase'].includes(r.id)).map(r=>({...r,sets:['core','plank','suitcase'].includes(r.id)?1:r.sets}));if(S.mode==='home'&&!S.profile.pull&&p[0]?.id==='dbrow'&&p[1]?.id==='dbrow'){p[0].sets=S.short?2:4;p.splice(1,1);}return p;}
const lastFor=(id,exclude)=>S.history.slice().reverse().flatMap(h=>h.items.filter(it=>it.id===id&&h.id!==exclude).map(it=>({date:h.date,sets:it.logs,planned:it.sets}))).find(x=>x.sets.length);function hint(e,last,planned){if(!last)return 'First session: start conservatively; leave ~2–3 good reps in reserve.';let a=last.sets, same=a.every(l=>l.load.trim().toLowerCase()===a[0].load.trim().toLowerCase());if(!same||a.some(l=>/unrecorded/i.test(l.load)))return 'Different or missing setups in the previous session. Establish a consistent setup before comparing or increasing resistance.';if(['selfrow','selflat','selfcurl','rearself','core'].includes(e.id))return 'This low-load fallback is hard to compare. Keep technique and opposing effort consistent; move to measurable resistance when available.';if(a.length>=planned&&a.length===last.planned&&a.every(l=>l.reps>=e.max&&l.rir>=1))return 'If using the same setup as last time, all prescribed sets reached the top. Consider a small resistance or leverage increase; restart near the low end.';if(a.some(l=>l.rir===0||l.reps<e.min))return 'Repeat or reduce resistance if needed; use clean reps and leave some reserve. No forced progression.';return 'Only compare the same setup and similar effort. Try an extra strict rep or second if ready; otherwise repeat.';}
function start(){if(S.active)return;S.active={id:Date.now().toString(),date:localDay(),mode:S.mode,day:S.day,short:S.short,started:Date.now(),cursor:0,items:plan().map(r=>({...r,logs:[],skipped:false})),accessory:false};save();render();window.scrollTo(0,0);}let gymLength='standard',gymPurpose='replace',gymOpen=false;function gymDayCard(){let p=gymDayPlan(gymLength),sets=p.reduce((n,i)=>n+i.sets,0);return `<details class="card" id="gymDay" ${gymOpen?'open':''} ontoggle="gymOpen=this.open"><summary><b>One-off gym day</b> <small>· optional</small></summary><div class="eyebrow" style="margin-top:12px">Occasional gym access</div><p class="muted mini">Use machines and cables that are difficult to replicate at home. Lats and side delts come first. Your usual training environment stays unchanged.</p><label>Session size</label><div class="row">${[['quick','Quick'],['standard','Standard'],['extended','Extended']].map(([k,v])=>`<button class="${gymLength===k?'active':''}" onclick="gymLength='${k}';render()">${v}</button>`).join('')}</div><label style="margin-top:12px">How should it count?</label><select class="full" onchange="gymPurpose=this.value;render()"><option value="replace" ${gymPurpose==='replace'?'selected':''}>Replace next Workout ${S.day}</option><option value="bonus" ${gymPurpose==='bonus'?'selected':''}>Extra session (keep A/B unchanged)</option></select><p class="mini muted" style="margin-top:10px">${sets} working sets · about ${estimateMinutes(p)} min. ${gymPurpose==='replace'?'A completed session advances your usual A/B rotation. A partial session does not.':'Bonus sessions do not count toward your two essential sessions or advance the rotation. Avoid stacking hard sessions on consecutive days.'}</p><p class="warning mini">If medically cleared, warm up and learn unfamiliar machines using light practice sets. Keep 2–3 reps in reserve; no max testing. Extended only if accustomed to this volume.</p><button class="primary full" onclick="startGymDay()">Start one-off function startGymDay(){if(S.active)return;if(!['quick','standard','extended'].includes(gymLength)||!['replace','bonus'].includes(gymPurpose))return;S.active={id:Date.now().toString(),date:localDay(),mode:'gym',day:'Gym day',short:gymLength==='quick',started:Date.now(),cursor:0,items:gymDayPlan(gymLength),accessory:gymPurpose==='bonus',oneOff:true,gymPurpose,gymLength,rotationDay:S.day};save();render();window.scrollTo(0,0);}
function startAccessory(){if(S.active)return;S.active={id:Date.now().toString(),date:localDay(),mode:S.mode,day:'Support',short:true,started:Date.now(),cursor:0,items:accessories[S.mode].filter(id=>id!=='external'||S.profile.band||S.mode==='bands'||S.mode==='gym').map(id=>({id,sets:1,alts:[id],logs:[],skipped:false})),accessory:true};save();render();}function current(){return S.active?.items[S.active.cursor];}function record(){let a=S.active,it=current();if(!a||!it||it.logs.length>=it.sets)return;let reps=$('reps').value,rir=$('rir').value,load=$('load').value.trim();if(!safeNum(reps,1,300)||!Number.isInteger(+reps)||rir===''||!safeNum(rir,0,5)||!Number.isInteger(+rir)||load.length>160){toast('Enter reps/seconds and RIR.');return;}if(!load&&!['No equipment','Bodyweight','Wall'].includes(equipmentFor(it.id)))return toast('Record the actual load or setup, e.g. bodyweight, red band or 9 kg.');delete drafts[draftKey()];it.skipped=false;it.logs.push({reps:+reps,rir:+rir,load:load||'Bodyweight',time:Date.now()});S.timer={end:Date.now()+E[it.id].rest*1000};save();render();updateTimer();toast(storageOK&&!storageBlocked?'Set saved':'Set kept in memory only · export backup');}function next(){captureDraft();if(!S.active)return;let it=current();if(it&&it.logs.length<it.sets&&!it.skipped){if(!confirm('Move on with fewer than planned sets?'))return;it.skipped=true;}if(S.active.cursor<S.active.items.length-1)S.active.cursor++;else {save();return finish();}save();render();window.scrollTo(0,0);}function prev(){captureDraft();if(S.active?.cursor>0){S.active.cursor--;save();render();window.scrollTo(0,0);}}function undo(){if(current()?.logs.length){current().logs.pop();current().skipped=false;S.timer=null;save();render();}}function finish(){let a=S.active;if(!a)return;let n=a.items.reduce((s,i)=>s+i.logs.length,0);if(!n){toast('Log at least one set, or discard the session.');return;}let total=a.items.reduce((s,i)=>s+i.sets,0);if(!confirm(`Save ${n}/${total} planned sets? ${n<total?'This will be marked partial.':'All planned sets complete.'}`))return;S.history.push({...a,ended:Date.now()});if(!a.accessory&&n>=total)S.day=(a.oneOff?a.rotationDay:a.day)==='A'?'B':'A';S.active=null;S.timer=null;save();switchTab('Progress');toast(storageOK&&!storageBlocked?'Workout saved':'Workout kept in memory only · export backup');}function abandon(){if(confirm('Discard this unfinished session? Logged sets in this session will be lost.')){S.active=null;S.timer=null;save();render();}}function swap(i,id){if(S.active){let it=S.active.items[i];if(it.logs.length){toast('Undo logged sets before changing the exercise.');return;}if(!it.alts.includes(id))return;it.id=id;}else{S.subs[`${S.mode}-${S.day}-${i}`]=id;}save();render();}function chooseMode(m){if(S.active||!Object.hasOwn(modes,m))return;S.mode=m;S.modeManual=true;save();render();}function timerAction(kind){if(kind==='stop')S.timer=null;else if(kind==='add'&&S.timer)S.timer.end=Math.max(Date.now(),S.timer.end)+30000;save();updateTimer();}function updateTimer(){let el=$('timer');if(!S.timer){el.style.display='none';return;}let n=Math.max(0,Math.ceil((S.timer.end-Date.now())/1000));el.style.display='block';el.innerHTML=`<div class="row"><b>${n?`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`:'Ready'}</b><button onclick="timerAction('add')">+30s</button><button aria-label="Dismiss rest timer" onclick="timerAction('stop')">×</button></div><small>${n?'Rest · extend if needed':'Start next set when ready'}</small>`;}

function today(){if(S.active)return workout();let p=plan(),total=p.reduce((a,b)=>a+b.sets,0);return `<div class="card"><div class="eyebrow">Training environment</div><h2>${esc(modes[S.mode])}</h2><div class="switcher">${Object.entries(modes).map(([k,v])=>`<button class="${S.mode===k?'active':''}" onclick="chooseMode('${k}')">${esc(v)}</button>`).join('')}</div>${S.mode==='basic'?'<p class="note mini" style="margin-top:12px">Handles only: pulling and side-delt loading are limited. Switch to bands mode when you have suitable bands.</p>':''}${S.mode==='home'?'<p class="muted mini" style="margin-top:10px">Equipment availability can be changed in Settings.</p>':''}</div>${gymDayCard()}<div class="card"><div class="row between"><div><div class="eyebrow">Next session</div><h2>Workout ${S.day}</h2><small>${total} working sets · ${S.short?'minimum':'standard'} · about ${estimateMinutes(p)} min</small></div><div class="row"><button class="${S.day==='A'?'active':''}" onclick="S.day='A';save();render()">A</button><button class="${S.day==='B'?'active':''}" onclick="S.day='B';save();render()">B</button></div></div><div class="row" style="margin:12px 0"><button class="${!S.short?'active':''}" onclick="S.short=false;save();render()">Standard</button><button class="${S.short?'active':''}" onclick="S.short=true;save();render()">Minimum</button></div><button class="primary full" onclick="start()">Start guided workout →</button><p class="mini muted" style="margin-top:10px">If medically cleared for exercise: warm up about 5 minutes and use easy practice sets before new or demanding movements. Start with 2–3 RIR. Stop for chest discomfort, faintness or unusual breathlessness.</p>${p.map((r,i)=>{let e=E[r.id];return `<div class="exercise"><div class="row between"><div class="grow"><b>${i+1}. ${esc(e.n)}</b><div class="mini muted">${r.sets} × ${e.min}–${e.max} ${unit(e)} · ${esc(e.p.join(', '))}</div></div>${r.alts.length>1?`<select aria-label="Alternative for ${esc(e.n)}" onchange="swap(${r.idx},this.value)">${r.alts.map(id=>`<option value="${id}" ${id===r.id?'selected':''}>${esc(E[id].n)}</option>`).join('')}</select>`:''}</div></div>`}).join('')}</div><div class="card"><h3>Small-muscle support</h3><p class="muted mini">Optional short session for serratus, rotator cuff (if light bands available), tibialis and hip stability. Or add one or two after the main workout.</p><button class="full" onclick="startAccessory()">Start support circuit</button></div><div class="card"><h3>Today’s rule</h3><p>Make every rep comparable. Increase reps or resistance only when you can maintain control.</p><button onclick="switchTab('Rules')">Browse rulebook</button></div>`;}
function workout(){let a=S.active,it=current(),e=E[it.id],last=lastFor(it.id,a.id),n=a.items.reduce((s,i)=>s+i.logs.length,0),t=a.items.reduce((s,i)=>s+i.sets,0),suggest=it.logs.at(-1)||last?.sets?.[it.logs.length]||last?.sets?.[0];return `<div class="row between"><div><div class="eyebrow">${a.oneOff?'One-off gym day · '+(a.gymPurpose==='replace'?'replaces '+a.rotationDay:'bonus'):'Workout '+esc(a.day)+' · '+esc(modes[a.mode])}</div><h2>Exercise ${a.cursor+1} of ${a.items.length}</h2></div><button onclick="finish()">Finish</button></div><div class="bar"><i style="width:${100*n/t}%"></i></div><small>${n}/${t} sets logged · ${a.items.filter(x=>x.skipped&&x.logs.length<x.sets).length} moved on early</small><div class="card"><span class="tag">${esc(e.p.join(' · '))}</span><h2>${esc(e.n)}</h2><p class="muted mini">${esc(e.eq)} · ${it.sets} × ${e.min}–${e.max} ${unit(e)}${unilateral.has(e.id)?' · each side (log weaker side)':''}</p>${it.alts.length>1&&!it.logs.length?`<label>Exercise substitution</label><select class="full" onchange="swap(${a.cursor},this.value)">${it.alts.map(id=>`<option ${id===it.id?'selected':''} value="${id}">${esc(E[id].n)}</option>`).join('')}</select>`:''}<button class="full" onclick="document.getElementById('setEntry').scrollIntoView({block:'center'})">Jump to set logging ↓</button><details open><summary>How to perform</summary>${guide(e)}</details></div><div class="card"><h3>Previous performance</h3><p class="mini muted">Compare only matching equipment, technique and effort. Prior numbers are guidance, not today's actual reps.</p>${last?`<p class="mini muted">${esc(last.date)} · ${last.sets.map(s=>`${s.reps} ${unit(e)} @ ${esc(s.load)} (${s.rir} RIR)`).join(' / ')}</p>`:'<p class="muted mini">No completed history for this exercise yet.</p>'}<p class="note mini">${esc(hint(e,last,it.sets))}</p></div><div class="card" id="setEntry"><h3>Set ${Math.min(it.logs.length+1,it.sets)} of ${it.sets}</h3>${it.logs.length?`<div class="mini muted">${it.logs.map((s,i)=>`Set ${i+1}: ${s.reps} ${unit(e)} · ${esc(s.load)} · RIR ${s.rir}`).join('<br>')}</div><button class="mini" onclick="undo()">Undo last set</button>`:''}${it.logs.length<it.sets?`<div class="field" style="margin-top:12px"><label for="load">Resistance / setup (kg, band colour, leverage)</label><input id="load" maxlength="160" class="full" placeholder="e.g. red band, feet hip width" value="${esc(suggest?.load||'')}"></div><div class="grid"><div><label for="reps">${unit(e)==='sec'?'Seconds held':'Strict reps (each side if unilateral)'}</label><input id="reps" type="number" inputmode="numeric" min="1" max="300" placeholder="${e.min}–${e.max}" value=""></div><div><label for="rir">Reps in reserve (hold: effort equivalent)</label><select id="rir"><option value="">Select</option>${[0,1,2,3,4,5].map(i=>`<option  value="${i}">${i===5?'5+':i}</option>`).join('')}</select></div></div><button class="primary full" style="margin-top:14px" onclick="record()">Log set & start ${e.rest}s rest</button>`:'<p class="tag">All prescribed sets logged.</p>'}</div><div class="row"><button onclick="prev()" ${a.cursor===0?'disabled':''}>← Back</button><button class="primary grow" onclick="next()">${a.cursor===a.items.length-1?'Finish workout':'Next exercise →'}</button></div><details class="card"><summary>Session overview</summary>${a.items.map((r,i)=>`<div class="exercise row between"><span>${i+1}. ${esc(E[r.id].n)}</span><button class="mini" onclick="jumpExercise(${i})" aria-label="Open exercise ${i+1}">${r.logs.length}/${r.sets} · Open</button></div>`).join('')}<button class="danger" onclick="abandon()">Discard unfinished session</button></details>`;}
function rules(){let categories=[...new Set(RULES.map(r=>r[0]))];return `<h2>Science rulebook</h2><div class="card compact"><b>Before every session</b><p class="mini">Warm up, use stable equipment, keep 1–3 good reps in reserve, record comparable setup, rest until ready. Stop for chest discomfort or unusual symptoms.</p></div><p class="muted">${RULES.length} practical rules · evidence labels distinguish general research from coaching applications.</p><input id="ruleSearch" class="full" placeholder="Search rules: protein, failure, bands…" value="${esc(search)}" oninput="search=this.value;renderRulesList()"><div class="row" style="margin-top:10px"><button class="${onlyFav?'active':''}" onclick="onlyFav=!onlyFav;render()">★ Saved only</button></div><div id="rulesList"></div><p class="mini muted">Evidence links require internet. Not individual medical advice; recommendations are starting points.</p>`;}
function renderRulesList(){let r=RULES.map((v,i)=>({v,i})).filter(({v,i})=>(!onlyFav||S.favs.includes(i))&&v.join(' ').toLowerCase().includes(search.toLowerCase()));let cats=[...new Set(r.map(x=>x.v[0]))];$('rulesList').innerHTML=cats.map(c=>`<div class="card"><h3>${esc(c)}</h3>${r.filter(x=>x.v[0]===c).map(({v,i})=>`<div class="rule"><div class="row between"><b class="grow">${esc(v[2])}</b><button class="mini ${S.favs.includes(i)?'active':''}" aria-label="Save rule" onclick="fav(${i})">${S.favs.includes(i)?'★':'☆'}</button></div><small class="tag">${esc(v[1])}</small><p>${esc(v[3])}</p>${SOURCES[v[4]]?`<a class="mini" target="_blank" rel="noopener" href="${SOURCES[v[4]][1]}">${esc(SOURCES[v[4]][0])} ↗</a>`:''}</div>`).join('')}</div>`).join('')||'<p class="empty">No matching rules.</p>';}
function fav(i){S.favs=S.favs.includes(i)?S.favs.filter(x=>x!==i):[...S.favs,i];save();renderRulesList();}
function library(){return `<h2>Exercise library</h2><p class="muted">Offline step-by-step technique; online video search if available.</p><input class="full" placeholder="Search exercise or muscle" value="${esc(exerciseSearch)}" oninput="exerciseSearch=this.value;renderLibrary()"><div id="libraryList"></div>`;}
function renderLibrary(){let q=exerciseSearch.toLowerCase();$('libraryList').innerHTML=Object.values(E).filter(e=>[e.n,e.eq,...e.p,...e.s].join(' ').toLowerCase().includes(q)).map(e=>`<details class="card"><summary>${esc(e.n)}</summary><p class="tag mini">${esc(e.p.join(', '))} · ${esc(e.eq)}</p><small>${e.min}–${e.max} ${unit(e)} · rest ${e.rest}s</small>${guide(e)}</details>`).join('')||'<p class="empty">No exercises found.</p>';}
function weekStart(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}function coverage(){let out={};S.history.concat(S.active?[S.active]:[]).forEach(h=>h.items.forEach(it=>E[it.id]?.p.forEach(m=>out[m]=(out[m]||0)+it.logs.filter(l=>l.time>=weekStart()&&l.time<=Date.now()).length)));return out;}function progress(){let cov=coverage(),last=S.history.slice().reverse(),wk=last.filter(h=>h.started>=weekStart()&&!h.accessory&&h.items.every(i=>i.logs.length===i.sets)).length;let selected=historyFilter||Object.keys(E).find(id=>lastFor(id))||'pull';let series=last.slice().reverse().flatMap(h=>h.items.filter(i=>i.id===selected&&i.logs.length).map(i=>({date:h.date,reps:i.logs[0].reps,load:i.logs[0].load})));let measurements=S.measures.slice().reverse();let muscles=['Lats','Side delts','Rear delts','Mid back','Biceps','Triceps','Chest','Quads','Hamstrings','Glutes','Calves','Soleus','Tibialis','Core','Abs','Hip stabilisers','Rotator cuff','Serratus','Lower traps','Grip','Brachialis','Front delts','Upper traps','Adductors','Spinal erectors','Forearms'];return `<h2>Progress</h2><div class="card grid"><div class="stat"><small>This week</small><b>${wk}/2</b><small>Full/minimum sessions</small></div><div class="stat"><small>All time</small><b>${last.length}</b><small>Saved sessions</small></div></div><div class="card"><h3>Weekly muscle coverage</h3><p class="muted mini">Logged primary-muscle sets since Monday, including active sessions. These are counts, not measured stimulus: easy/self-resisted sets may contribute little. Secondary work is shown alongside primary counts; a zero is not proof of neglect.</p>${muscles.map(m=>`<div class="row mini"><span style="width:112px">${m}</span><div class="bar grow" style="margin:5px 0"><i style="width:${Math.min(100,(cov[m]||0)*10)}%"></i></div><b style="width:24px;text-align:right">${cov[m]||0}</b><small style="width:65px">+${secondaryCoverage(m)} indirect</small></div>`).join('')}</div><div class="card"><h3>Exercise performance</h3><select class="full" onchange="historyFilter=this.value;render()">${Object.values(E).map(e=>`<option ${e.id===selected?'selected':''} value="${e.id}">${esc(e.n)}</option>`).join('')}</select>${series.length?`<p class="mini muted" style="margin-top:10px">First set per session; only compare matching resistance/setup.</p>${series.slice(-12).reverse().map(x=>`<div class="exercise row between"><span>${esc(x.date)}</span><b>${x.reps} ${unit(E[selected])}</b><small>${esc(x.load)}</small></div>`).join('')}`:'<p class="empty">Log a workout to see performance.</p>'}</div><div class="card"><h3>Body measurements</h3><p class="muted mini">Use the same time and measurement technique each time. Optional fields.</p><div class="grid">${[['weight','Weight kg'],['waist','Waist cm'],['arm','Arm cm'],['shoulder','Shoulder circumference cm']].map(([k,l])=>`<div><label>${l}</label><input id="m_${k}" aria-label="${l}" type="number" step="0.1" inputmode="decimal"></div>`).join('')}</div><button class="full" onclick="addMeasure()" style="margin-top:12px">Save measurements</button>${measurements.slice(0,10).map(m=>`<div class="exercise mini"><b>${esc(m.date)}</b> · ${Object.entries(m).filter(([k])=>k!=='date').map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</div>`).join('')}</div><div class="card"><h3>Walking / running</h3><p class="mini muted">Activity log only; no automatic 10 km progression is prescribed until medical clearance and a baseline are established.</p><p class="warning mini">Unexplained chest pain: obtain medical clearance before vigorous running. Build gradually; don't force a pace in cold weather.</p><div class="grid"><div><label>Distance (km)</label><input id="runKm" type="number" step="0.1" min="0"></div><div><label>Minutes</label><input id="runMin" type="number" min="1"></div></div><label>Type</label><select id="runType"><option>Walk</option><option>Run/walk</option><option>Run</option></select><button class="full" style="margin-top:10px" onclick="addRun()">Save activity</button>${S.runs.slice().reverse().slice(0,8).map(r=>`<div class="exercise mini">${esc(r.date)} · ${esc(r.type)} · ${r.km} km · ${r.min} min</div>`).join('')}</div><div class="card"><h3>Session history</h3>${last.length?last.map(h=>`<details class="exercise"><summary>${esc(h.date)} · ${esc(h.day)}${h.oneOff?' ('+(h.gymPurpose==='replace'?'replaces '+h.rotationDay:'bonus')+')':''} · ${esc(modes[h.mode])} · ${h.items.reduce((s,i)=>s+i.logs.length,0)}/${h.items.reduce((s,i)=>s+i.sets,0)} sets · ${h.items.every(i=>i.logs.length===i.sets)?'Complete':'Partial'}</summary>${h.items.filter(i=>i.logs.length).map(i=>`<p class="mini"><b>${esc(E[i.id].n)}</b><br>${i.logs.map(s=>`${s.reps} ${unit(E[i.id])} · ${esc(s.load)} · RIR ${s.rir}`).join('<br>')}</p>`).join('')}<button class="danger mini" onclick="deleteHistory('${h.id}')">Delete session</button></details>`).join(''):'<p class="empty">No saved sessions yet.</p>'}</div>`;}
function addMeasure(){let m={date:localDay()};for(let k of ['weight','waist','arm','shoulder']){let v=$('m_'+k).value;if(v!==''){if(!safeNum(v,k==='weight'?20:1,k==='weight'?300:500))return toast('Check '+k+' measurement.');m[k]=+v;}}if(Object.keys(m).length<2)return toast('Enter at least one valid measurement.');S.measures.push(m);if(m.weight)S.profile.weight=m.weight;save();render();toast('Measurements saved');}function addRun(){let km=$('runKm').value,min=$('runMin').value;if(!safeNum(km,0.01,200)||!safeNum(min,1,1440))return toast('Enter valid distance and time.');S.runs.push({date:localDay(),km:+km,min:+min,type:$('runType').value});save();render();toast('Activity saved');}function deleteHistory(id){if(confirm('Delete this session permanently?')){S.history=S.history.filter(h=>h.id!==id);save();render();}}
function settings(){return `<h2>Settings & backup</h2>${storageBlocked?`<div class="card warning">Stored records could not be read. They have not been overwritten. <button onclick="recoverRaw()">Download original data</button> <button onclick="resetBlocked()">Reset storage</button></div>`:''}<div class="card"><h3>Available equipment</h3><p class="muted mini">Applies to NUS dorm mode. Korea bands mode assumes bands available. Use water bottles for light lateral raises if you have no light weights.</p><label><input type="checkbox" ${S.profile.band?'checked':''} onchange="S.profile.band=this.checked;save()"> Long-loop resistance bands</label><label><input type="checkbox" ${S.profile.pull?'checked':''} onchange="S.profile.pull=this.checked;save()"> Secure pull-up bar</label><button class="full" style="margin-top:10px" onclick="S.modeManual=false;if(!S.active)S.mode=defaultMode();save();render()">Use date-based mode selection</button></div><div class="card"><h3>Nutrition target</h3><label>Body weight (kg)</label><input type="number" step="0.1" value="${esc(S.profile.weight)}" onchange="if(safeNum(this.value,20,300)){S.profile.weight=+this.value;save();render()}"><p style="margin-top:10px"><b>${Math.round(S.profile.weight*1.6)}–${Math.round(S.profile.weight*2.2)} g</b> protein/day · practical range. Sleep 7–9 hours.</p></div><div class="card"><h3>Data ownership</h3><p class="muted">No account or server. Your browser stores the logs. Export regularly; clearing site/browser data can erase them. Local file storage varies by browser. A hosted PWA is more reliable.</p><button class="primary full" onclick="exportData()">Export backup (JSON)</button><button class="full" style="margin-top:8px" onclick="$('import').click()">Restore backup</button><p class="mini muted" style="margin-top:10px">Restoring replaces your existing data. Back up before switching browser or device.</p></div><div class="card"><h3>Safety & programme notes</h3><p class="warning mini">Because of your reported unexplained chest pain, get medical assessment before vigorous exercise or high-stimulant supplements. Stop for chest discomfort, faintness or unusual breathlessness and seek urgent care if severe/persistent.</p><p class="muted mini">Two essential workouts a week, ideally nonconsecutive. Begin with minimum mode or fewer sets if returning after a break. Travel walking is baseline activity; running can wait until cleared. Use the support circuit as tolerated. No equipment-free plan can guarantee equivalent lat or shoulder growth.</p></div><div class="card"><h3>Installation</h3><p class="muted">Open the hosted app in Chrome → menu → Add to Home screen / Install app. The PWA needs HTTPS (or localhost) and one successful online visit to cache it. Standalone HTML can be opened offline without hosting, but saving and installation vary.</p><small>Project V · v2.1 · one-off gym day</small><p id="offlineStatus" class="mini muted">${location.protocol==='file:'?'Standalone file: browser storage can vary.':'Offline readiness depends on service worker installation.'}</p></div>`;}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`project-v-backup-${localDay()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported');}function validate(x){const obj=v=>v&&typeof v==='object'&&!Array.isArray(v),num=(v,a,b)=>typeof v==='number'&&Number.isFinite(v)&&v>=a&&v<=b,int=(v,a,b)=>Number.isInteger(v)&&num(v,a,b),str=(v,n=160)=>typeof v==='string'&&v.length<=n,date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v),own=(o,k)=>typeof k==='string'&&Object.hasOwn(o,k),arr=(v,n)=>Array.isArray(v)&&v.length<=n; if(!obj(x)||x.version!==1||!own(modes,x.mode)||!['A','B'].includes(x.day)||!arr(x.history,20000)||!arr(x.measures,20000)||!arr(x.runs,20000)||!arr(x.favs,1000)||!obj(x.profile)||!num(x.profile.weight,20,300)||!obj(x.subs)||!Object.entries(x.subs).every(([k,v])=>/^(home|basic|bands|gym)-[AB]-\d+$/.test(k)&&own(E,v))||!x.favs.every(v=>int(v,0,RULES.length-1)))return false;const session=h=>obj(h)&&str(h.id,30)&&/^\d+$/.test(h.id)&&date(h.date)&&num(h.started,0,9e15)&&own(modes,h.mode)&&['A','B','Support','Gym day'].includes(h.day)&&(h.day==='Gym day'?(h.oneOff===true&&h.mode==='gym'&&['replace','bonus'].includes(h.gymPurpose)&&['quick','standard','extended'].includes(h.gymLength)&&['A','B'].includes(h.rotationDay)&&h.accessory===(h.gymPurpose==='bonus')):!h.oneOff)&&arr(h.items,40)&&h.items.length>0&&h.items.every(i=>obj(i)&&own(E,i.id)&&int(i.sets,1,20)&&arr(i.alts,30)&&i.alts.every(k=>own(E,k))&&i.alts.includes(i.id)&&arr(i.logs,20)&&i.logs.length<=i.sets&&i.logs.every(l=>obj(l)&&int(l.reps,1,300)&&int(l.rir,0,5)&&str(l.load)&&num(l.time,0,9e15)));return x.history.every(session)&&new Set(x.history.map(h=>h.id)).size===x.history.length&&(!x.active||(session(x.active)&&int(x.active.cursor,0,x.active.items.length-1)&&!x.history.some(h=>h.id===x.active.id)))&&x.measures.every(m=>obj(m)&&date(m.date)&&Object.entries(m).every(([k,v])=>k==='date'||(['weight','waist','arm','shoulder'].includes(k)&&num(v,k==='weight'?20:1,k==='weight'?300:500))))&&x.runs.every(r=>obj(r)&&date(r.date)&&num(r.km,0.01,200)&&num(r.min,1,1440)&&['Walk','Run/walk','Run'].includes(r.type))&&(!x.timer||(obj(x.timer)&&num(x.timer.end,0,9e15)));}$('import').addEventListener('change',async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!validate(x))throw Error('Invalid backup');if(confirm('Replace all current data with this backup?')){S={...initial(),...x,profile:{...initial().profile,...x.profile},timer:null};storageBlocked=false;save();render();toast('Backup restored');}}catch(err){toast('Could not restore: invalid backup file.');}e.target.value='';});
function recoverRaw(){try{let raw=localStorage.getItem(KEY);if(raw===null)return toast('No stored data');downloadText(raw,'project-v-recovery.json');}catch(e){toast('Storage unavailable');}}function downloadText(text,name){let u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}function resetBlocked(){if(confirm('Reset unreadable stored data? Download the original first.')){storageBlocked=false;save();render();}}
function equipmentFor(id){return E[id].eq;}
function jumpExercise(i){captureDraft();if(S.active&&Number.isInteger(i)&&S.active.items[i]){S.active.cursor=i;save();render();window.scrollTo(0,0);}}
function secondaryCoverage(m){return S.history.concat(S.active?[S.active]:[]).flatMap(h=>h.items).filter(it=>E[it.id].s.includes(m)).reduce((n,it)=>n+it.logs.filter(l=>l.time>=weekStart()&&l.time<=Date.now()).length,0);}
function draftKey(){let it=current();return it&&`${S.active.id}:${S.active.cursor}:${it.id}:${it.logs.length}`;}function captureDraft(){let k=draftKey();if(k&&$('reps')&&$('rir')&&$('load'))drafts[k]={reps:$('reps').value,rir:$('rir').value,load:$('load').value};}function restoreDraft(){let d=drafts[draftKey()];if(d&&$('reps'))for(let k of ['reps','rir','load'])$(k).value=d[k];}
function estimateMinutes(p){return Math.ceil((300+p.reduce((n,r)=>n+r.sets*(E[r.id].rest+(unilateral.has(r.id)?70:40))+30,0))/60/5)*5;}
function render(){let tabs=[['Today','▶'],['Rules','≡'],['Library','▤'],['Progress','▥'],['Settings','⚙']];$('nav').innerHTML=tabs.map(([t,ic])=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')"><b>${ic}</b>${t}</button>`).join('');$('app').innerHTML=({Today:today,Rules:rules,Library:library,Progress:progress,Settings:settings}[tab])();if(tab==='Today')restoreDraft();if(tab==='Rules')renderRulesList();if(tab==='Library')renderLibrary();updateTimer();}setInterval(updateTimer,1000);render();$('status').textContent=storageBlocked?'Recovery needed · Settings':storageOK?'Local storage':'Not saved · export';window.addEventListener('storage',e=>{if(e.key===KEY){toast('Data changed in another tab. Reload before logging more sets.');storageBlocked=true;$('status').textContent='Reload required';}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{let e=$('offlineStatus');if(e)e.textContent='Offline cache installed; test in airplane mode before travel.';}).catch(()=>{let e=$('offlineStatus');if(e)e.textContent='Offline cache installation failed; reload online and retry.';});}
</script></body></html>
