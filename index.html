ex('pull','Pull-up',['Lats'],['Biceps','Mid back','Grip'],'Pull-up bar',4,10,150,'Grip just outside shoulder width; start with controlled arms overhead.|Pull elbows down toward your ribs until chin approaches the bar.|Lower with control; avoid swinging.','Use assisted reps if needed; progress strict reps, then resistance.','pull','Check bar installation and rating. If you cannot do controlled reps, switch to rows.');
ex('chin','Chin-up',['Lats'],['Biceps','Grip'],'Pull-up bar',4,10,150,'Use a comfortable palms-toward-you grip.|Pull elbows toward ribs; keep ribs and hips controlled.|Lower fully within a comfortable range.','Progress strict reps before adding load.','pull','Check bar installation; substitute a row if needed.');
ex('dbrow','One-arm dumbbell row',['Lats','Mid back'],['Biceps','Rear delts','Grip'],'9 kg dumbbell',10,20,120,'Brace free hand on a stable surface or thigh; hinge at hips.|Pull elbow toward hip without twisting.|Lower until arm extends comfortably.','Increase reps; use more resistance when both sides reach the top.','row');
ex('bandrow','Standing bent-over band row',['Lats','Mid back'],['Biceps','Rear delts','Grip'],'Medium/heavy long loop',10,20,120,'Stand securely on the middle of the loop with both feet; hold both sides.|Hinge with a neutral back; pull elbows toward hips.|Lower slowly; keep the band firmly beneath feet.','Shorten working band length or use a stronger band, recording setup.','row','Wear shoes; inspect band; keep recoil path away from face.');
ex('selfrow','Self-resisted one-arm row',['Lats','Mid back'],['Biceps'],'No equipment',10,20,75,'Grasp the working wrist with your other hand.|Draw working elbow backward while the other hand resists forward.|Slowly return against resistance; repeat on both sides.','Increase controlled repetitions or consistent opposing effort. This is a fallback, not a substitute for loaded pulling.','row');
ex('backpackrow','Backpack row',['Lats','Mid back'],['Biceps','Grip'],'Optional sturdy loaded backpack',10,20,120,'Secure books or water bottles in a sturdy backpack and close it.|Hinge at hips, holding a rated handle or both straps.|Row toward your waist and lower slowly.','Add modest, secure load if the bag and straps are rated for it.','row','Optional only; inspect straps and seams. Do not overload luggage.');
ex('latband','Band lateral raise',['Side delts'],['Upper traps'],'Light long loop',12,25,75,'Stand on the band; hold one end at your side.|Raise arm slightly forward of your side with a soft elbow.|Stop around shoulder height; lower slowly.','Increase reps then band tension, without shrugging.','raise','Start with the lightest band; do not use 9 kg if form breaks.');
ex('latdb','Dumbbell lateral raise',['Side delts'],['Upper traps'],'Light dumbbells or water bottles',12,25,75,'Stand tall, soft elbows.|Raise arms slightly forward of your sides up to shoulder level.|Lower under control; no swinging.','Use lighter bottles or bands if 9 kg is too heavy.','raise');
ex('selflat','Self-resisted lateral raise',['Side delts'],[],'No equipment',12,20,60,'Place opposite hand on working forearm.|Raise working arm out and slightly forward against gentle opposing pressure.|Control the return; repeat both sides.','Keep opposing pressure comparable; add repetitions. Limited loading.','raise');
ex('push','Handle push-up',['Chest'],['Triceps','Front delts','Serratus'],'Push-up handles / stable surface',6,20,120,'Set handles on a flat, non-slip surface; hands just wider than shoulders.|Keep head, trunk and hips in one line; lower only to a comfortable depth.|Push back up; avoid flared elbows and sagging hips.','Use wall or sturdy counter for easier reps; progress to floor handles or harder leverage.','push','Check handle load rating and stability; no excessive depth.');
ex('closepush','Close-grip handle push-up',['Triceps'],['Chest','Front delts','Serratus'],'Push-up handles',6,20,120,'Set handles roughly shoulder width apart, parallel and stable.|Keep elbows close but not pinned; lower under control.|Press up while keeping body straight.','Increase reps or use harder leverage; use a stable incline if too hard.','push');
ex('split','Split squat',['Quads','Glutes'],['Hip stabilisers','Adductors'],'Bodyweight',8,20,120,'Stand in a staggered stance with feet hip-width apart.|Lower both knees; front foot stays flat and knee follows toes.|Push through front foot and stand; repeat both sides.','Increase reps then depth, pauses or safe external load.','split');
ex('dbsplit','Loaded split squat',['Quads','Glutes'],['Hip stabilisers','Adductors'],'Dumbbells or kettlebell',8,20,120,'Hold one weight goblet-style or two at sides.|Lower in staggered stance, front foot flat.|Stand using front leg; repeat both sides.','Increase reps then load or controlled depth.','split');
ex('bandrdl','Band Romanian deadlift',['Hamstrings','Glutes'],['Spinal erectors','Grip'],'Medium/heavy long loop',10,20,120,'Stand on band securely; hold sides of loop at thighs.|Push hips back with soft knees and neutral spine.|Stand by driving hips forward; do not lean back.','Add reps, then stronger band or shorter working length.','hinge');
ex('dbrdl','Dumbbell Romanian deadlift',['Hamstrings','Glutes'],['Spinal erectors','Grip'],'2 × 9 kg dumbbells',10,20,120,'Hold weights near thighs, feet hip-width.|Hinge at hips with soft knees until hamstrings stretch comfortably.|Stand tall without arching.','Increase reps then consider staggered stance or added resistance.','hinge');
ex('singlehinge','Single-leg hip hinge',['Hamstrings','Glutes'],['Hip stabilisers','Spinal erectors'],'Bodyweight',10,20,75,'Stand on one leg, knee slightly bent; use a wall for balance.|Push hips back as free leg extends behind you.|Return upright, hips square; repeat sides.','Progress range, reps and optional secure backpack load.','hinge');
ex('curlband','Band curl',['Biceps'],['Brachialis','Forearms'],'Medium long loop',10,20,75,'Stand on band with both feet; arms beside ribs, palms up.|Curl without moving elbows forward or swinging.|Lower fully with control.','Increase reps, then band tension with consistent foot stance.','curl');
ex('curldb','Dumbbell curl',['Biceps'],['Brachialis','Forearms'],'Dumbbells (9 kg at home; suitable load at gym)',8,15,90,'Stand with elbows near ribs, palms up.|Curl without swinging trunk.|Lower fully and slowly.','Increase reps before load; alternate arms if needed.','curl');
ex('hammer','Hammer curl',['Brachialis','Biceps'],['Forearms','Grip'],'Dumbbells or medium band',8,20,75,'Hold weights or band with neutral grip.|Curl without moving elbows or torso.|Lower with control.','Progress reps then resistance.','curl');
ex('selfcurl','Self-resisted curl',['Biceps'],['Brachialis'],'No equipment',10,20,60,'Place opposite palm over working hand or wrist.|Curl against steady pressure from opposite hand.|Resist the lowering phase, then switch sides.','Aim for comparable pressure and controlled reps; loading is limited.','curl');
ex('triband','Band overhead triceps extension',['Triceps'],[],'Light/medium long loop',10,20,75,'Secure band beneath one foot; hold it behind head with both hands.|Keep elbows pointing mostly upward; extend elbows.|Return to a comfortable stretch without arching back.','Increase reps before band tension.','tri','Inspect band and secure foot anchor; avoid face recoil.');
ex('tridb','Overhead dumbbell triceps extension',['Triceps'],[],'One 9 kg dumbbell',10,20,90,'Hold a secure dumbbell overhead with both hands.|Bend elbows to lower behind head within comfortable range.|Extend without flaring excessively or arching back.','Add strict reps, then resistance.','tri','Use only a secure fixed dumbbell and pain-free shoulder motion.');

ex('calf','Single-leg standing calf raise',['Calves'],['Foot stabilisers'],'Bodyweight / optional dumbbell',12,25,60,'Use wall lightly for balance; stand on one foot.|Rise as high as comfortable with straight but unlocked knee.|Lower slowly to the floor; switch sides.','Add reps then safe load.','calf');
ex('soleus','Bent-knee calf raise',['Soleus'],['Calves'],'Bodyweight',12,25,60,'Hold a wall for balance; bend knees slightly.|Keep knee angle steady and lift heels.|Lower slowly; repeat.','Progress to one leg or add light load.','calf');
ex('tib','Wall tibialis raise',['Tibialis'],[],'Wall',15,30,60,'Lean back against wall with feet slightly forward.|Keep heels down and lift toes toward shins.|Lower toes slowly.','Move feet farther from wall or increase reps.','calf');
ex('scap','Scapular push-up',['Serratus'],['Core'],'Wall / handles',10,20,60,'Keep elbows straight against wall or in a stable push-up position.|Allow shoulder blades to glide together slightly.|Push surface away, spreading shoulder blades; keep spine still.','Progress from wall to stable incline to handles.','push');
ex('external','Band external rotation',['Rotator cuff'],[],'Light long loop',12,20,60,'Hold band between hands; elbows at sides bent 90 degrees.|Rotate forearms outward while elbows stay against ribs.|Return slowly; do not force range.','Increase repetitions before tension.','curl');

ex('plank','Handle plank',['Core'],['Serratus'],'Push-up handles',20,45,75,'Set handles on a non-slip floor and assume straight-arm plank.|Brace abdomen; keep ribs down and hips level.|Breathe normally and stop if back arches.','Increase seconds, then use harder leverage.','push');

function frame(e,phase=0){let v=VISUALS[e.id];return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 152" role="img" aria-label="${esc(e.n)}: ${esc(v.labels[phase])}" focusable="false">${phase?v.b:v.a}</svg>`;}function pattern(e){let v=VISUALS[e.id];return `<figure class="visual"><div class="visualpair"><div>${frame(e)}<figcaption>${esc(v.labels[0])}</figcaption></div><div>${frame(e,1)}<figcaption>${esc(v.labels[1])}</figcaption></div></div><small>Illustrated guide · use the written setup for exact equipment.</small></figure>`;}function thumb(e){return `<span class="thumb" aria-hidden="true">${frame(e,1)}</span>`;}
function guide(e,showVisual=true){let q=esc(e.n)+' exercise proper form';return `<div class="guide">${showVisual?pattern(e):''}<ol>${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>${e.caution?`<p class="warning mini">${esc(e.caution)}</p>`:''}<p class="note mini">Progress: ${esc(e.prog)}</p><a class="mini" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">Find video demonstration ↗ (internet)</a></div>`;}
function today(){if(S.active)return workout();let p=plan(),total=p.reduce((a,b)=>a+b.sets,0),wk=weeklyCount();return `<div class="home-top"><div class="row between"><h2>Training</h2><span class="weekmark">${wk} of 2 this week</span></div><label class="mode-field"><span>Equipment</span><select aria-label="Training environment" onchange="chooseMode(this.value)">${Object.entries(modes).map(([k,v])=>`<option value="${k}" ${S.mode===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label></div><section class="session-panel"><div class="row between"><h3>Workout ${S.day}</h3><div class="seg dayseg"><button class="${S.day==='A'?'active':''}" onclick="setDay('A')">A</button><button class="${S.day==='B'?'active':''}" onclick="setDay('B')">B</button></div></div><p class="session-meta">${estimateMinutes(p)} min · ${total} sets · ${p.length} movements</p><div class="seg lengthseg"><button class="${!S.short?'active':''}" onclick="S.short=false;save();render()">Standard</button><button class="${S.short?'active':''}" onclick="S.short=true;save();render()">Minimum</button></div><button class="primary full start-main" onclick="start()">Start guided workout <span aria-hidden="true">→</span></button></section>${S.mode==='basic'?'<p class="muted mini">Handles only: loaded pulling and side-delt work are limited.</p>':''}${gymDayCard()}<section class="plan-list" id="planPreview"><div class="row between list-heading"><h3>Exercises</h3><small>${p.length} movements</small></div>${p.map((r,i)=>{let e=E[r.id];return `<div class="plan-row">${thumb(e)}<div class="grow"><b>${esc(e.n)}</b><small>${r.sets} × ${e.min}–${e.max} ${unit(e)} · ${esc(e.p.join(', '))}</small></div>${r.alts.length>1?`<details class="swap-inline"><summary aria-label="Alternatives for ${esc(e.n)}">Swap</summary><select aria-label="Alternative for ${esc(e.n)}" onchange="swap(${r.idx},this.value)">${r.alts.map(id=>`<option value="${id}" ${id===r.id?'selected':''}>${esc(E[id].n)}</option>`).join('')}</select></details>`:''}</div>`}).join('')}</section><details class="card"><summary>Optional support circuit</summary><p class="muted mini">Serratus, rotator cuff (if suitable bands), tibialis and hip stability.</p><button class="full" onclick="startAccessory()">Start support circuit</button></details><details class="card"><summary>Before you train</summary><p class="muted mini">If medically cleared, warm up and do easy practice sets. Start with 2–3 RIR. Stop for chest discomfort, faintness or unusual breathlessness.</p><button class="full" onclick="switchTab('Rules')">Training rules</button></details>`;}
function workout(){let a=S.active,it=current(),e=E[it.id],last=lastFor(it.id,a.id),n=a.items.reduce((s,i)=>s+i.logs.length,0),t=a.items.reduce((s,i)=>s+i.sets,0),suggest=it.logs.at(-1)||last?.sets?.[it.logs.length]||last?.sets?.[0],complete=it.logs.length>=it.sets;return `<section class="session-head">${storageBlocked||!storageOK?'<div class="status-alert">Storage problem · export backup in Settings</div>':''}<div class="row between"><div class="eyebrow">${a.oneOff?'GYM DAY · '+(a.gymPurpose==='replace'?'REPLACES '+a.rotationDay:'EXTRA'):'WORKOUT '+esc(a.day)+' · '+esc(modes[a.mode])}</div><button class="quiet" onclick="finish()">Finish</button></div><div class="row between"><span class="mini muted">Exercise ${a.cursor+1} of ${a.items.length}</span><span class="mini muted">${n}/${t} sets logged</span></div><div class="bar" role="progressbar" aria-label="Workout sets logged" aria-valuenow="${n}" aria-valuemax="${t}" aria-valuemin="0"><i style="width:${100*n/t}%"></i></div></section><section class="movement"><div class="tag muscle-label">${esc(e.p.join(' · '))}</div><h2>${esc(e.n)}</h2><p class="muted mini">${esc(e.eq)}${unilateral.has(e.id)?' · each side; log weaker side':''}</p><div class="targets"><div><span>REPS / SET</span><b>${e.min}–${e.max}<small> ${unit(e)==='sec'?'sec':''}</small></b></div><div><span>SETS</span><b>${it.logs.length}<small> / ${it.sets}</small></b></div><div><span>REST</span><b>${e.rest}<small> s</small></b></div></div>${pattern(e)}<p class="cue"><b>Setup</b> ${esc(e.cues[0])}</p><p class="cue execution"><b>Move</b> ${esc(e.cues[1]||e.cues[0])}</p>${e.caution?`<p class="warning mini compact-warning">${esc(e.caution)}</p>`:''}<details class="technique"><summary>Technique &amp; demonstration</summary>${guide(e,false)}</details></section><section class="card logcard" id="setEntry"><div class="row between"><h3>${complete?'Exercise complete':'Log set '+(it.logs.length+1)+' of '+it.sets}</h3><span class="setdots" aria-label="${it.logs.length} sets completed">${Array.from({length:it.sets},(_,i)=>`<i class="${i<it.logs.length?'done':i===it.logs.length?'current':''}"></i>`).join('')}</span></div>${complete?`<p class="tag">All planned sets logged.</p><button class="primary full" onclick="next()">${a.cursor===a.items.length-1?'Finish workout':'Next exercise →'}</button>`:`<div class="field"><label for="load">Resistance / setup</label><input id="load" maxlength="160" class="full" placeholder="e.g. 9 kg, red band, bodyweight" value="${esc(suggest?.load||'')}">${suggest?'<small class="setup-hint">Previous setup filled in; edit if changed.</small>':''}</div><div class="grid log-grid"><div><label for="reps">${unit(e)==='sec'?'Seconds held':'Actual strict reps'}</label><div class="stepper"><button type="button" aria-label="Decrease actual reps" onclick="stepReps(-1)">−</button><input id="reps" type="number" inputmode="numeric" min="1" max="300" placeholder="${e.min}–${e.max}" value=""><button type="button" aria-label="Increase actual reps" onclick="stepReps(1)">+</button></div></div><div><label for="rir">RIR · ${unit(e)==='sec'?'effort estimate':'reps left'}</label><select id="rir" aria-label="Reps in reserve"><option value="">Choose RIR</option>${[0,1,2,3,4,5].map(i=>`<option value="${i}">${['0 · failure','1 · one left','2 · two left','3 · three left','4 · four left','5+ · easier'][i]}</option>`).join('')}</select></div></div>${suggest?`<div class="prior-inline"><span>Previous: ${suggest.reps} ${unit(e)} · RIR ${suggest.rir}</span><button type="button" onclick="usePrevious(${suggest.reps})">Use reps</button></div>`:`<p class="mini muted first-log">Enter actual reps and effort after the set.</p>`}<button class="primary full log-button" onclick="record()">Log set &amp; start rest <span aria-hidden="true">→</span></button>`}${it.logs.length?`<details class="logged"><summary>Logged sets <small>${it.logs.length}</small></summary>${it.logs.map((s,i)=>`<div class="logged-row"><b>Set ${i+1}</b><span>${s.reps} ${unit(e)} · ${esc(s.load)}</span><small>RIR ${s.rir}</small></div>`).join('')}<button class="full" onclick="undo()">Undo last set</button></details>`:''}</section><section class="card previous"><h3>Last performance &amp; next target</h3>${last?`<p class="mini muted">${esc(last.date)} · ${last.sets.map(s=>`${s.reps} ${unit(e)} @ ${esc(s.load)} (${s.rir} RIR)`).join(' / ')}</p>`:'<p class="mini muted">No recorded sets for this exercise yet.</p>'}<p class="note mini">${esc(hint(e,last,it.sets))}</p></section><div class="row exercise-actions"><button onclick="prev()" ${a.cursor===0?'disabled':''}>← Back</button>${!complete?`<button class="grow" onclick="next()">Skip / next exercise →</button>`:''}</div>${it.alts.length>1&&!it.logs.length?`<details class="card"><summary>Change exercise</summary><label for="swapExercise">Equipment-compatible alternative</label><select id="swapExercise" class="full" onchange="swap(${a.cursor},this.value)">${it.alts.map(id=>`<option ${id===it.id?'selected':''} value="${id}">${esc(E[id].n)}</option>`).join('')}</select></details>`:''}<details class="card"><summary>Session overview <small>${a.items.length} exercises</small></summary>${a.items.map((r,i)=>`<div class="exercise row between"><span>${i+1}. ${esc(E[r.id].n)}</span><button class="mini" onclick="jumpExercise(${i})" aria-label="Open exercise ${i+1}">${r.logs.length}/${r.sets} · Open</button></div>`).join('')}<button class="danger full" onclick="abandon()">Discard unfinished session</button></details>`;}
function rules(){let categories=[...new Set(RULES.map(r=>r[0]))];return `<div class="pageintro"><div class="eyebrow">LEARN</div><h2>Science rulebook</h2><p class="muted">${RULES.length} rules · searchable and saved offline.</p></div><div class="card essentials"><span class="tag mini">START HERE</span><h3>Before every session</h3><p>Warm up. Use stable equipment. Leave 1–3 good reps in reserve. Record the setup and rest until ready.</p><p class="warning mini">Stop for chest discomfort or unusual symptoms.</p></div><label for="ruleSearch">Search rules</label><input id="ruleSearch" class="full searchbox" placeholder="Protein, failure, bands…" value="${esc(search)}" oninput="search=this.value;renderRulesList()"><div class="filterrow"><select id="ruleCat" aria-label="Rule category" onchange="ruleCat=this.value;renderRulesList()"><option value="">All topics</option>${categories.map(c=>`<option ${ruleCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="${onlyFav?'active':''}" onclick="onlyFav=!onlyFav;render()" aria-pressed="${onlyFav}">★ Saved</button></div><div id="ruleCount" class="mini muted"></div><div id="rulesList"></div><p class="mini muted">Evidence links require internet. Recommendations are starting points, not individual medical advice.</p>`;}
function renderRulesList(){let r=RULES.map((v,i)=>({v,i})).filter(({v,i})=>(!onlyFav||S.favs.includes(i))&&(!ruleCat||v[0]===ruleCat)&&v.join(' ').toLowerCase().includes(search.toLowerCase()));let cats=[...new Set(r.map(x=>x.v[0]))];$('ruleCount').textContent=`${r.length} matching rules`;$('rulesList').innerHTML=cats.map(c=>`<section class="rulegroup"><h3>${esc(c)}</h3>${r.filter(x=>x.v[0]===c).map(({v,i})=>`<article class="rule"><div class="row between"><b class="grow">${esc(v[2])}</b><button class="favorite ${S.favs.includes(i)?'active':''}" aria-label="${S.favs.includes(i)?'Remove saved rule':'Save rule'}" aria-pressed="${S.favs.includes(i)}" onclick="fav(${i})">${S.favs.includes(i)?'★':'☆'}</button></div><span class="evidence">${esc(v[1])}</span><p>${esc(v[3])}</p>${SOURCES[v[4]]?`<a class="mini" target="_blank" rel="noopener" href="${SOURCES[v[4]][1]}">${esc(SOURCES[v[4]][0])} ↗</a>`:''}</article>`).join('')}</section>`).join('')||'<p class="empty">No matching rules.</p>';}
function fav(i){S.favs=S.favs.includes(i)?S.favs.filter(x=>x!==i):[...S.favs,i];save();renderRulesList();}
function library(){return `<div class="pageintro"><div class="eyebrow">REFERENCE</div><h2>Exercise library</h2><p class="muted">Find a movement or muscle, then expand for setup and execution.</p></div><label for="libSearch">Find an exercise</label><input id="libSearch" class="full searchbox" placeholder="e.g. lats, band, triceps" value="${esc(exerciseSearch)}" oninput="exerciseSearch=this.value;renderLibrary()"><div class="filterrow"><select aria-label="Library equipment filter" onchange="libFilter=this.value;renderLibrary()"><option value="all" ${libFilter==='all'?'selected':''}>All equipment</option><option value="plan" ${libFilter==='plan'?'selected':''}>Current plan only</option></select></div><div id="libCount" class="mini muted"></div><div id="libraryList"></div>`;}
function renderLibrary(){let q=exerciseSearch.toLowerCase(),ids=new Set(S.active?S.active.items.flatMap(r=>r.alts):plan().flatMap(r=>r.alts)),list=Object.values(E).filter(e=>(libFilter!=='plan'||ids.has(e.id))&&[e.n,e.eq,...e.p,...e.s].join(' ').toLowerCase().includes(q));$('libCount').textContent=`${list.length} exercises`;$('libraryList').innerHTML=list.map(e=>`<details class="library-item"><summary>${thumb(e)}<span class="grow"><b>${esc(e.n)}</b><small>${esc(e.p.join(' · '))} · ${esc(e.eq)}</small></span></summary><p class="tag mini">${e.min}–${e.max} ${unit(e)} · rest ${e.rest}s</p>${guide(e)}</details>`).join('')||'<p class="empty">No exercises found.</p>';}
function weekStart(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}function coverage(){let out={};S.history.concat(S.active?[S.active]:[]).forEach(h=>h.items.forEach(it=>E[it.id]?.p.forEach(m=>out[m]=(out[m]||0)+it.logs.filter(l=>l.time>=weekStart()&&l.time<=Date.now()).length)));return out;}function progress(){let cov=coverage(),last=S.history.slice().reverse(),wk=last.filter(h=>h.started>=weekStart()&&!h.accessory&&h.items.every(i=>i.logs.length===i.sets)).length;let selected=historyFilter||Object.keys(E).find(id=>lastFor(id))||'pull';let series=last.slice().reverse().flatMap(h=>h.items.filter(i=>i.id===selected&&i.logs.length).map(i=>({date:h.date,reps:i.logs[0].reps,load:i.logs[0].load})));let measurements=S.measures.slice().reverse();let muscles=['Lats','Side delts','Rear delts','Mid back','Biceps','Triceps','Chest','Quads','Hamstrings','Glutes','Calves','Soleus','Tibialis','Core','Abs','Hip stabilisers','Rotator cuff','Serratus','Lower traps','Grip','Brachialis','Front delts','Upper traps','Adductors','Spinal erectors','Forearms'];return `<div class="pageintro"><div class="eyebrow">YOUR LOG</div><h2>Progress</h2><p class="muted">Track consistency and comparable performance.</p></div><div class="card grid progress-stats"><div class="stat"><small>This week</small><b>${wk}/2</b><small>Full/minimum sessions</small></div><div class="stat"><small>All time</small><b>${last.length}</b><small>Saved sessions</small></div></div><div class="card"><h3>Exercise performance</h3><select class="full" onchange="historyFilter=this.value;render()">${Object.values(E).map(e=>`<option ${e.id===selected?'selected':''} value="${e.id}">${esc(e.n)}</option>`).join('')}</select>${series.length?`<p class="mini muted" style="margin-top:10px">First set per session; only compare matching resistance/setup.</p>${series.slice(-12).reverse().map(x=>`<div class="exercise row between"><span>${esc(x.date)}</span><b>${x.reps} ${unit(E[selected])}</b><small>${esc(x.load)}</small></div>`).join('')}`:'<p class="empty">Log a workout to see performance.</p>'}</div><details class="card coverage-card"><summary>Weekly muscle coverage</summary><p class="muted mini">Logged primary-muscle sets since Monday, including active sessions. A ~10-set weekly target for priority muscles is a research-informed starting point, not a required minimum. These bars show counts, not measured growth; easy or self-resisted sets may contribute little. Indirect work is counted separately.</p>${muscles.map(m=>`<div class="row mini"><span style="width:112px">${m}</span><div class="bar grow" style="margin:5px 0"><i style="width:${Math.min(100,(cov[m]||0)*10)}%"></i></div><b style="width:24px;text-align:right">${cov[m]||0}</b><small style="width:65px">+${secondaryCoverage(m)} indirect</small></div>`).join('')}</details><details class="card"><summary>Body measurements</summary><p class="muted mini">Use the same time and measurement technique each time. Optional fields.</p><div class="grid">${[['weight','Weight kg'],['waist','Waist cm'],['arm','Arm cm'],['shoulder','Shoulder circumference cm']].map(([k,l])=>`<div><label>${l}</label><input id="m_${k}" aria-label="${l}" type="number" step="0.1" inputmode="decimal"></div>`).join('')}</div><button class="full" onclick="addMeasure()" style="margin-top:12px">Save measurements</button>${measurements.slice(0,10).map(m=>`<div class="exercise mini"><b>${esc(m.date)}</b> · ${Object.entries(m).filter(([k])=>k!=='date').map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</div>`).join('')}</details><details class="card"><summary>Walking / running</summary><p class="mini muted">Activity log only. Build running gradually once medically cleared and a baseline is established; travel walking counts as activity.</p><p class="warning mini">Unexplained chest pain: obtain medical clearance before vigorous running. Build gradually; don't force a pace in cold weather.</p><div class="grid"><div><label>Distance (km)</label><input id="runKm" type="number" step="0.1" min="0"></div><div><label>Minutes</label><input id="runMin" type="number" min="1"></div></div><label>Type</label><select id="runType"><option>Walk</option><option>Run/walk</option><option>Run</option></select><button class="full" style="margin-top:10px" onclick="addRun()">Save activity</button>${S.runs.slice().reverse().slice(0,8).map(r=>`<div class="exercise mini">${esc(r.date)} · ${esc(r.type)} · ${r.km} km · ${r.min} min</div>`).join('')}</details><div class="card"><h3>Session history</h3>${last.length?last.map(h=>`<details class="exercise"><summary>${esc(h.date)} · ${esc(h.day)}${h.oneOff?' ('+(h.gymPurpose==='replace'?'replaces '+h.rotationDay:'bonus')+')':''} · ${esc(modes[h.mode])} · ${h.items.reduce((s,i)=>s+i.logs.length,0)}/${h.items.reduce((s,i)=>s+i.sets,0)} sets · ${h.items.every(i=>i.logs.length===i.sets)?'Complete':'Partial'}</summary>${h.items.filter(i=>i.logs.length).map(i=>`<p class="mini"><b>${esc(E[i.id].n)}</b><br>${i.logs.map(s=>`${s.reps} ${unit(E[i.id])} · ${esc(s.load)} · RIR ${s.rir}`).join('<br>')}</p>`).join('')}<button class="danger mini" onclick="deleteHistory('${h.id}')">Delete session</button></details>`).join(''):'<p class="empty">No saved sessions yet.</p>'}</div>`;}
function addMeasure(){let m={date:localDay()};for(let k of ['weight','waist','arm','shoulder']){let v=$('m_'+k).value;if(v!==''){if(!safeNum(v,k==='weight'?20:1,k==='weight'?300:500))return toast('Check '+k+' measurement.');m[k]=+v;}}if(Object.keys(m).length<2)return toast('Enter at least one valid measurement.');S.measures.push(m);if(m.weight)S.profile.weight=m.weight;save();render();toast('Measurements saved');}function addRun(){let km=$('runKm').value,min=$('runMin').value;if(!safeNum(km,0.01,200)||!safeNum(min,1,1440))return toast('Enter valid distance and time.');S.runs.push({date:localDay(),km:+km,min:+min,type:$('runType').value});save();render();toast('Activity saved');}function deleteHistory(id){if(confirm('Delete this session permanently?')){S.history=S.history.filter(h=>h.id!==id);save();render();}}
function settings(){return `<h2>Settings & backup</h2>${storageBlocked?`<div class="card warning">Stored records could not be read. They have not been overwritten. <button onclick="recoverRaw()">Download original data</button> <button onclick="resetBlocked()">Reset storage</button></div>`:''}<div class="card"><h3>Available equipment</h3><p class="muted mini">Applies to NUS dorm mode. Korea bands mode assumes bands available. Use water bottles for light lateral raises if you have no light weights.</p><label><input type="checkbox" ${S.profile.band?'checked':''} onchange="S.profile.band=this.checked;save()"> Long-loop resistance bands</label><label><input type="checkbox" ${S.profile.pull?'checked':''} onchange="S.profile.pull=this.checked;save()"> Secure pull-up bar</label><button class="full" style="margin-top:10px" onclick="S.modeManual=false;if(!S.active)S.mode=defaultMode();save();render()">Use date-based mode selection</button></div><div class="card"><h3>Nutrition target</h3><label>Body weight (kg)</label><input type="number" step="0.1" value="${esc(S.profile.weight)}" onchange="if(safeNum(this.value,20,300)){S.profile.weight=+this.value;save();render()}"><p style="margin-top:10px"><b>${Math.round(S.profile.weight*1.6)}–${Math.round(S.profile.weight*2.2)} g</b> protein/day · practical range. Sleep 7–9 hours.</p></div><div class="card"><h3>Data ownership</h3><p class="muted">No account or server. Your browser stores the logs. Export regularly; clearing site/browser data can erase them. Local file storage varies by browser. A hosted PWA is more reliable.</p><button class="primary full" onclick="exportData()">Export backup (JSON)</button><button class="full" style="margin-top:8px" onclick="$('import').click()">Restore backup</button><p class="mini muted" style="margin-top:10px">Restoring replaces your existing data. Back up before switching browser or device.</p></div><div class="card"><h3>Safety & programme notes</h3><p class="warning mini">Because of your reported unexplained chest pain, get medical assessment before vigorous exercise or high-stimulant supplements. Stop for chest discomfort, faintness or unusual breathlessness and seek urgent care if severe/persistent.</p><p class="muted mini">Two essential workouts a week, ideally nonconsecutive. Begin with minimum mode or fewer sets if returning after a break. Travel walking is baseline activity; running can wait until cleared. Use the support circuit as tolerated. No equipment-free plan can guarantee equivalent lat or shoulder growth.</p></div><div class="card"><h3>Installation</h3><p class="muted">Open the hosted app in Chrome → menu → Add to Home screen / Install app. The PWA needs HTTPS (or localhost) and one successful online visit to cache it. Standalone HTML can be opened offline without hosting, but saving and installation vary.</p><small>Project V · v4.0 · redesigned interface</small><p id="offlineStatus" class="mini muted">${location.protocol==='file:'?'Standalone file: browser storage can vary.':'Offline readiness depends on service worker installation.'}</p></div>`;}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`project-v-backup-${localDay()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported');}function validate(x){const obj=v=>v&&typeof v==='object'&&!Array.isArray(v),num=(v,a,b)=>typeof v==='number'&&Number.isFinite(v)&&v>=a&&v<=b,int=(v,a,b)=>Number.isInteger(v)&&num(v,a,b),str=(v,n=160)=>typeof v==='string'&&v.length<=n,date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v),own=(o,k)=>typeof k==='string'&&Object.hasOwn(o,k),arr=(v,n)=>Array.isArray(v)&&v.length<=n; if(!obj(x)||x.version!==1||!own(modes,x.mode)||!['A','B'].includes(x.day)||!arr(x.history,20000)||!arr(x.measures,20000)||!arr(x.runs,20000)||!arr(x.favs,1000)||!obj(x.profile)||!num(x.profile.weight,20,300)||!obj(x.subs)||!Object.entries(x.subs).every(([k,v])=>/^(home|basic|bands|gym)-[AB]-\d+$/.test(k)&&own(E,v))||!x.favs.every(v=>int(v,0,RULES.length-1)))return false;const session=h=>obj(h)&&str(h.id,30)&&/^\d+$/.test(h.id)&&date(h.date)&&num(h.started,0,9e15)&&own(modes,h.mode)&&['A','B','Support','Gym day'].includes(h.day)&&(h.day==='Gym day'?(h.oneOff===true&&h.mode==='gym'&&['replace','bonus'].includes(h.gymPurpose)&&['quick','standard','extended'].includes(h.gymLength)&&['A','B'].includes(h.rotationDay)&&h.accessory===(h.gymPurpose==='bonus')):!h.oneOff)&&arr(h.items,40)&&h.items.length>0&&h.items.every(i=>obj(i)&&own(E,i.id)&&int(i.sets,1,20)&&arr(i.alts,30)&&i.alts.every(k=>own(E,k))&&i.alts.includes(i.id)&&arr(i.logs,20)&&i.logs.length<=i.sets&&i.logs.every(l=>obj(l)&&int(l.reps,1,300)&&int(l.rir,0,5)&&str(l.load)&&num(l.time,0,9e15)));return x.history.every(session)&&new Set(x.history.map(h=>h.id)).size===x.history.length&&(!x.active||(session(x.active)&&int(x.active.cursor,0,x.active.items.length-1)&&!x.history.some(h=>h.id===x.active.id)))&&x.measures.every(m=>obj(m)&&date(m.date)&&Object.entries(m).every(([k,v])=>k==='date'||(['weight','waist','arm','shoulder'].includes(k)&&num(v,k==='weight'?20:1,k==='weight'?300:500))))&&x.runs.every(r=>obj(r)&&date(r.date)&&num(r.km,0.01,200)&&num(r.min,1,1440)&&['Walk','Run/walk','Run'].includes(r.type))&&(!x.timer||(obj(x.timer)&&num(x.timer.end,0,9e15)));}$('import').addEventListener('change',async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!validate(x))throw Error('Invalid backup');if(confirm('Replace all current data with this backup?')){S={...initial(),...x,profile:{...initial().profile,...x.profile},timer:null};storageBlocked=false;save();render();toast('Backup restored');}}catch(err){toast('Could not restore: invalid backup file.');}e.target.value='';});
function recoverRaw(){try{let raw=localStorage.getItem(KEY);if(raw===null)return toast('No stored data');downloadText(raw,'project-v-recovery.json');}catch(e){toast('Storage unavailable');}}function downloadText(text,name){let u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}function resetBlocked(){if(confirm('Reset unreadable stored data? Download the original first.')){storageBlocked=false;save();render();}}
function equipmentFor(id){return E[id].eq;}
function jumpExercise(i){captureDraft();if(S.active&&Number.isInteger(i)&&S.active.items[i]){S.active.cursor=i;save();render();window.scrollTo(0,0);}}
function secondaryCoverage(m){return S.history.concat(S.active?[S.active]:[]).flatMap(h=>h.items).filter(it=>E[it.id].s.includes(m)).reduce((n,it)=>n+it.logs.filter(l=>l.time>=weekStart()&&l.time<=Date.now()).length,0);}
function draftKey(){let it=current();return it&&`${S.active.id}:${S.active.cursor}:${it.id}:${it.logs.length}`;}function captureDraft(){let k=draftKey();if(k&&$('reps')&&$('rir')&&$('load'))drafts[k]={reps:$('reps').value,rir:$('rir').value,load:$('load').value};}function restoreDraft(){let d=drafts[draftKey()];if(d&&$('reps'))for(let k of ['reps','rir','load'])$(k).value=d[k];}
function estimateMinutes(p){return Math.ceil((300+p.reduce((n,r)=>n+r.sets*(E[r.id].rest+(unilateral.has(r.id)?70:40))+30,0))/60/5)*5;}
function render(){let tabs=['Today','Progress','Library','Rules','Settings'];$('nav').innerHTML=tabs.map(t=>`<button aria-current="${tab===t?'page':'false'}" class="${tab===t?'active':''}" onclick="switchTab('${t}')">${navIcon(t)}<span>${t}</span></button>`).join('');$('app').innerHTML=({Today:today,Rules:rules,Library:library,Progress:progress,Settings:settings}[tab])();document.body.classList.toggle('in-workout',tab==='Today'&&!!S.active);renderWorkDock();$('status').dataset.problem=String(storageBlocked||!storageOK);if(tab==='Today')restoreDraft();if(tab==='Rules')renderRulesList();if(tab==='Library')renderLibrary();updateTimer();}function weeklyCount(){return S.history.filter(h=>h.started>=weekStart()&&!h.accessory&&h.items.every(i=>i.logs.length===i.sets)).length;}function setDay(d){S.day=d;save();render();if($('planPreview')?.tagName==='DETAILS')$('planPreview').open=true;}
function dockAction(){let i=current();if(!i)return;if(i.logs.length>=i.sets){next();return;}let target=$('setEntry');target.scrollIntoView({block:'start'});}function renderWorkDock(){let d=$('workDock');let on=tab==='Today'&&!!S.active;d.hidden=!on;if(on){let i=current();d.innerHTML=`<button class="dock-back" onclick="prev()" ${S.active.cursor===0?'disabled':''} aria-label="Previous exercise">←</button><button class="primary dock-main" onclick="dockAction()">${i.logs.length>=i.sets?'Continue workout':'Log set '+(i.logs.length+1)+' of '+i.sets} <span>↓</span></button><button class="dock-back" onclick="next()" aria-label="Next exercise">→</button>`;}}
function navIcon(t){let p={Today:'<path d="M5 4l15 8-15 8z"/>',Progress:'<path d="M4 19V5M4 19h16M8 15l4-5 4 2 4-6"/>',Library:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M12 8h5M12 12h5"/>',Rules:'<path d="M5 3h12a2 2 0 012 2v16H7a2 2 0 01-2-2zM9 7h6M9 11h6M9 15h4"/>',Settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3"/>'}[t];return `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;}
function stepReps(d){let el=$('reps');if(!el)return;let v=el.value===''?0:Number(el.value);el.value=Math.max(1,Math.min(300,(Number.isFinite(v)?v:0)+d));el.dispatchEvent(new Event('input',{bubbles:true}));}
let ruleCat='';
let libFilter='all';
function usePrevious(n){if($('reps')){$('reps').value=n;}}
setInterval(updateTimer,1000);render();$('status').textContent=storageBlocked?'Recovery needed · Settings':storageOK?'Local storage':'Not saved · export';window.addEventListener('storage',e=>{if(e.key===KEY){toast('Data changed in another tab. Reload before logging more sets.');storageBlocked=true;$('status').textContent='Reload required';}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{let e=$('offlineStatus');if(e)e.textContent='Offline cache installed; test in airplane mode before travel.';}).catch(()=>{let e=$('offlineStatus');if(e)e.textContent='Offline cache installation failed; reload online and retry.';});}
